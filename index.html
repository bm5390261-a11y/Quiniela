<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiniela Gabito</title>
<meta name="theme-color" content="#127a47">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quiniela">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="api-shim.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7f5;color:#163026;font-family:Arial,sans-serif}
main{max-width:560px;margin:auto;padding:16px 16px 40px}
.tabs-nav{display:flex;background:#e2e8e5;border-radius:12px;padding:4px;margin-bottom:16px}
.tab-btn{flex:1;border:0;background:transparent;padding:12px;font-weight:800;font-size:14px;color:#5c7166;cursor:pointer;border-radius:10px;transition:all .2s}
.tab-btn.active{background:#fff;color:#127a47;box-shadow:0 2px 5px rgba(0,0,0,.08)}
.tab-content{display:none}.tab-content.active{display:block}
#capturaContenedor{background:#f4f7f5;padding:10px;border-radius:16px}
header{background:#127a47;color:#fff;border-radius:16px;padding:20px;margin-bottom:20px;text-align:center}
.logo-liga{height:65px;width:auto;object-fit:contain;margin:0 auto 10px;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
h1{margin:0 0 4px;font-size:26px}
header p{margin:0;opacity:.9;font-weight:bold}
label{display:block;font-weight:700;margin:0 0 7px}
input[type=text]{border:1px solid #c8d5ce;border-radius:10px;font:inherit;padding:11px;width:100%}
#nombre{margin-bottom:18px}
.partido{background:#fff;border:1px solid #dbe6e0;border-radius:14px;margin:12px 0;padding:16px 14px}
.partido.cerrado{opacity:.6}
.header-partido{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:14px}
.fecha-badge{background:#e8f3ed;color:#127a47;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px}
.badge-cerrado{background:#fde2e1;color:#a22c28;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px}
.estadio-info{color:#6b8277;font-size:12px;font-weight:600}
.marcador{align-items:center;display:grid;gap:4px;grid-template-columns:1fr 100px 16px 100px 1fr;text-align:center}
.equipo-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.escudo{width:45px;height:45px;object-fit:contain}
.equipo{font-weight:700;font-size:13px;overflow-wrap:anywhere;text-align:center}
.control-gol{display:flex;align-items:center;background:#f0f4f2;border:1px solid #c8d5ce;border-radius:10px;overflow:hidden;height:42px}
.btn-step{background:#e2e8e5;border:0;color:#127a47;cursor:pointer;font-size:18px;font-weight:800;width:28px;height:100%;display:flex;align-items:center;justify-content:center;user-select:none}
.goles{border:0;background:transparent;font-size:18px;font-weight:700;text-align:center;width:44px;padding:0;font-family:inherit;color:#163026}
.separador-vs{font-weight:800;color:#5c7166;font-size:16px}
button[type=submit]{background:#127a47;border:0;border-radius:10px;color:#fff;cursor:pointer;font:inherit;font-weight:700;margin-top:18px;padding:15px;width:100%}
button:disabled{background:#91aa9d;cursor:not-allowed}
#mensaje{display:none;border-radius:10px;margin-top:14px;padding:14px;text-align:center;font-weight:700}
.exito{background:#d8f0df;color:#0b572f;display:block!important}
.error{background:#fde2e1;color:#a22c28;display:block!important}
.acciones-post-envio{display:none;flex-direction:column;gap:10px;margin-top:14px}
.acciones-post-envio.visible{display:flex}
.btn-descargar-img{background:#007bff;color:#fff;border:0;font-weight:800;padding:14px;border-radius:10px;text-align:center;cursor:pointer;font-size:15px}
.btn-whatsapp{background:#25D366;color:#fff;text-decoration:none;font-weight:800;padding:14px;border-radius:10px;text-align:center;font-size:15px}
.ranking-card{background:#fff;border-radius:14px;padding:16px;border:1px solid #dbe6e0;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.ranking-header{text-align:center;margin-bottom:16px}
.ranking-header h2{margin:0 0 4px;color:#127a47;font-size:22px}
.ranking-buscador{margin-bottom:14px}
.ranking-tabla{width:100%;border-collapse:collapse;text-align:left}
.ranking-tabla th{background:#f0f4f2;color:#127a47;font-weight:800;padding:10px 12px;font-size:13px;text-transform:uppercase}
.ranking-tabla td{padding:12px;border-bottom:1px solid #edf2ef;font-size:14px;font-weight:600;cursor:pointer}
.ranking-tabla tr:hover{background:#eef5f1}
.posicion{font-weight:800;text-align:center;width:40px}
.puntos-col{text-align:center;font-weight:800;color:#127a47;font-size:16px;width:70px}
.podio-1{background:#fff9e6}.podio-2{background:#f4f5f7}.podio-3{background:#fdf5ed}
.indicador-ver{font-size:11px;color:#888;font-weight:normal;display:block}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal-contenido{background:#f4f7f5;border-radius:16px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.2);position:relative}
.modal-cerrar{position:absolute;top:12px;right:16px;background:transparent;border:0;font-size:24px;font-weight:bold;color:#127a47;cursor:pointer}
.modal-header-info{text-align:center;border-bottom:2px solid #127a47;padding-bottom:10px;margin-bottom:16px}
.modal-header-info h3{margin:0;font-size:20px;color:#127a47}
.modal-header-info p{margin:4px 0 0;font-weight:800;color:#163026}
.badge-acierto{font-size:10px;font-weight:800;padding:3px 8px;border-radius:12px;display:inline-block;margin-top:4px;text-transform:uppercase}
.exacto{background:#d8f0df;color:#0b572f}.ganador{background:#e8f3ed;color:#127a47}.fallo{background:#fde2e1;color:#a22c28}
</style>
</head>
<body>
<main>
<nav class="tabs-nav">
<button class="tab-btn active" onclick="cambiarPestana('pronosticos')">📝 MIS PRONÓSTICOS</button>
<button class="tab-btn" onclick="cambiarPestana('ranking')">🏆 POSICIONES</button>
</nav>

<div id="tabPronosticos" class="tab-content active">
<div id="capturaContenedor">
<header>
<img class="logo-liga" src="https://a.espncdn.com/i/leaguelogos/soccer/500/22.png" alt="Liga MX" crossorigin="anonymous">
<h1>Quiniela Gabito</h1>
<p id="jornada">JORNADA</p>
<small>Registra tus pronósticos.</small>
</header>
<form id="formulario">
<label for="nombre">Tu nombre</label>
<input id="nombre" type="text" autocomplete="name" maxlength="40" required placeholder="Escribe tu nombre">
<div id="partidos"><p style="text-align:center;color:#5c7166;font-weight:bold">Cargando partidos...</p></div>
<button id="enviar" type="submit">ENVIAR QUINIELA</button>
<div id="mensaje" role="status"></div>
</form>
</div>
<div id="accionesPost" class="acciones-post-envio">
<button id="btnDescargarImg" class="btn-descargar-img">📸 DESCARGAR FOTO DE QUINIELA</button>
<a id="btnWhatsapp" class="btn-whatsapp" href="https://wa.me/" target="_blank" rel="noopener">📲 ABRIR WHATSAPP Y ADJUNTAR FOTO</a>
</div>
</div>

<div id="tabRanking" class="tab-content">
<div class="ranking-card">
<div class="ranking-header">
<h2>🏆 Tabla de Posiciones</h2>
<small id="subtituloRanking">Cargando puntos…</small>
</div>
<div class="ranking-buscador"><input type="text" id="buscarParticipante" placeholder="🔍 Buscar participante…" onkeyup="filtrarTabla()"></div>
<table class="ranking-tabla">
<thead><tr><th class="posicion">#</th><th>Participante</th><th class="puntos-col">Pts</th></tr></thead>
<tbody id="cuerpoRanking"><tr><td colspan="3" style="text-align:center;padding:20px;color:#888">Cargando tabla de posiciones…</td></tr></tbody>
</table>
</div>
</div>

<div id="modalPronosticos" class="modal-overlay" onclick="cerrarModalAfuera(event)">
<div class="modal-contenido">
<button class="modal-cerrar" onclick="cerrarModal()">&times;</button>
<div class="modal-header-info"><h3 id="modalNombre">--</h3><p id="modalPuntos">Puntos: 0</p></div>
<div id="modalListaPartidos"></div>
</div>
</div>
</main>

<script>
let partidosGlobal = [], rankingGlobal = [], mapaEscudosGlobal = {};
const ESCUDO_DEF = 'https://a.espncdn.com/i/teamlogos/default-team-logo.png';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function cambiarPestana(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if (tab === 'pronosticos') {
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('tabPronosticos').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('tabRanking').classList.add('active');
    cargarRanking();
  }
}

function cargarDatosIniciales() {
  google.script.run.withSuccessHandler(j => { if (j) document.getElementById('jornada').textContent = j; }).obtenerJornada();
  google.script.run.withSuccessHandler(m => {
    mapaEscudosGlobal = m || {};
    google.script.run
      .withSuccessHandler(lista => { partidosGlobal = lista || []; renderizarPartidos(); })
      .withFailureHandler(e => {
        document.getElementById('partidos').innerHTML = '<p style="text-align:center;color:#a22c28;font-weight:bold">' + esc(e.message || 'No se pudieron cargar los partidos.') + '</p>';
      })
      .obtenerPartidos();
  }).obtenerEscudosMap();
}

function obtenerEscudo(nombre) {
  if (!nombre) return ESCUDO_DEF;
  return mapaEscudosGlobal[nombre.toLowerCase().trim()] || ESCUDO_DEF;
}

window.modificarGol = function (id, cambio) {
  const input = document.getElementById(id);
  if (!input || input.disabled) return;
  let v = parseInt(input.value, 10);
  if (isNaN(v)) v = 0;
  input.value = Math.min(20, Math.max(0, v + cambio));
};

function renderizarPartidos() {
  const cont = document.getElementById('partidos');
  cont.innerHTML = '';
  if (!partidosGlobal.length) {
    cont.innerHTML = '<p style="text-align:center;color:#888">No se encontraron partidos registrados.</p>';
    return;
  }
  partidosGlobal.forEach((p, i) => {
    const cerrado = !!p.cerrado, dis = cerrado ? 'disabled' : '', val = cerrado ? '' : 0, req = cerrado ? '' : 'required';
    const fecha = p.fechaHora || ('PARTIDO ' + (i + 1));
    const estadio = p.estadio ? '📍 ' + (p.estadio.toLowerCase().startsWith('estadio') ? p.estadio : 'Estadio ' + p.estadio) : '';
    const idL = 'gol_local_' + i, idV = 'gol_visita_' + i;
    const sec = document.createElement('section');
    sec.className = 'partido' + (cerrado ? ' cerrado' : '');
    sec.innerHTML = `
      <div class="header-partido">
        <span class="fecha-badge">${esc(fecha)}</span>
        ${cerrado ? '<span class="badge-cerrado">🔒 CERRADO</span>' : ''}
        ${estadio ? `<span class="estadio-info">${esc(estadio)}</span>` : ''}
      </div>
      <div class="marcador">
        <div class="equipo-col"><img class="escudo" src="${esc(obtenerEscudo(p.local))}" alt="${esc(p.local)}" crossorigin="anonymous"><span class="equipo">${esc(p.local)}</span></div>
        <div class="control-gol">
          <button type="button" class="btn-step" ${dis} onclick="modificarGol('${idL}',-1)">-</button>
          <input class="goles" id="${idL}" data-equipo="${esc(p.local)}" type="number" min="0" max="20" value="${val}" inputmode="numeric" ${dis} ${req}>
          <button type="button" class="btn-step" ${dis} onclick="modificarGol('${idL}',1)">+</button>
        </div>
        <span class="separador-vs">-</span>
        <div class="control-gol">
          <button type="button" class="btn-step" ${dis} onclick="modificarGol('${idV}',-1)">-</button>
          <input class="goles" id="${idV}" data-equipo="${esc(p.visitante)}" type="number" min="0" max="20" value="${val}" inputmode="numeric" ${dis} ${req}>
          <button type="button" class="btn-step" ${dis} onclick="modificarGol('${idV}',1)">+</button>
        </div>
        <div class="equipo-col"><img class="escudo" src="${esc(obtenerEscudo(p.visitante))}" alt="${esc(p.visitante)}" crossorigin="anonymous"><span class="equipo">${esc(p.visitante)}</span></div>
      </div>`;
    cont.appendChild(sec);
  });
  if (partidosGlobal.every(p => p.cerrado)) {
    const b = document.getElementById('enviar');
    b.disabled = true;
    b.textContent = 'QUINIELA CERRADA';
  }
}

function cargarRanking() {
  google.script.run.withSuccessHandler(lista => {
    rankingGlobal = lista || [];
    const cuerpo = document.getElementById('cuerpoRanking'), sub = document.getElementById('subtituloRanking');
    if (!rankingGlobal.length) {
      cuerpo.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:20px">Aún no hay participantes registrados.</td></tr>';
      sub.textContent = '0 participantes';
      return;
    }
    sub.textContent = rankingGlobal.length + ' participante(s) • Haz clic para ver sus marcadores';
    cuerpo.innerHTML = rankingGlobal.map((item, i) => {
      const pos = i + 1;
      const medalla = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : pos;
      const clase = pos <= 3 ? 'podio-' + pos : '';
      return `<tr class="${clase}" onclick="verDetalleParticipante(${i})">
        <td class="posicion">${medalla}</td>
        <td>${esc(item.participante)}<span class="indicador-ver">👁️ Ver pronósticos y aciertos</span></td>
        <td class="puntos-col">${item.puntos}</td></tr>`;
    }).join('');
  }).withFailureHandler(() => {
    document.getElementById('cuerpoRanking').innerHTML = '<tr><td colspan="3" style="text-align:center;padding:20px;color:#a22c28">No se pudo cargar la tabla. Intenta de nuevo.</td></tr>';
  }).obtenerRanking();
}

window.verDetalleParticipante = function (indice) {
  const p = rankingGlobal[indice];
  if (!p) return;
  document.getElementById('modalNombre').textContent = p.participante;
  document.getElementById('modalPuntos').textContent = 'Puntos Totales: ' + p.puntos;
  const cont = document.getElementById('modalListaPartidos');
  cont.innerHTML = '';
  partidosGlobal.forEach((partido, idx) => {
    const gLs = p.pronosticos[partido.local], gVs = p.pronosticos[partido.visitante];
    const tiene = gLs !== undefined && gLs !== '' && gVs !== undefined && gVs !== '';
    const oculto = !partido.cerrado;
    const gL = oculto ? '🔒' : (tiene ? gLs : '-');
    const gV = oculto ? '🔒' : (tiene ? gVs : '-');
    let etiqueta = '';
    if (tiene && !oculto && partido.golesLocalReal !== null && partido.golesVisitaReal !== null) {
      const pl = Number(gLs), pv = Number(gVs), rl = partido.golesLocalReal, rv = partido.golesVisitaReal;
      if (pl === rl && pv === rv) etiqueta = '<span class="badge-acierto exacto">🎯 +3 pts (Exacto)</span>';
      else {
        const gan = (a, b) => a > b ? 'L' : (a < b ? 'V' : 'E');
        etiqueta = gan(pl, pv) === gan(rl, rv)
          ? '<span class="badge-acierto ganador">⚽ +1 pt (Ganador)</span>'
          : '<span class="badge-acierto fallo">❌ 0 pts</span>';
      }
    }
    const div = document.createElement('div');
    div.className = 'partido';
    div.style.cssText = 'padding:10px 12px;margin:8px 0;text-align:center';
    div.innerHTML = `
      <div class="header-partido" style="margin-bottom:6px">
        <span class="fecha-badge" style="font-size:10px">${esc(partido.fechaHora || ('Partido ' + (idx + 1)))}</span>${etiqueta}
      </div>
      <div class="marcador" style="grid-template-columns:1fr 30px 10px 30px 1fr">
        <div class="equipo-col"><img class="escudo" style="width:32px;height:32px" src="${esc(obtenerEscudo(partido.local))}"><span class="equipo" style="font-size:11px">${esc(partido.local)}</span></div>
        <span style="font-size:18px;font-weight:800;color:#127a47">${esc(gL)}</span>
        <span class="separador-vs">-</span>
        <span style="font-size:18px;font-weight:800;color:#127a47">${esc(gV)}</span>
        <div class="equipo-col"><img class="escudo" style="width:32px;height:32px" src="${esc(obtenerEscudo(partido.visitante))}"><span class="equipo" style="font-size:11px">${esc(partido.visitante)}</span></div>
      </div>`;
    cont.appendChild(div);
  });
  document.getElementById('modalPronosticos').classList.add('active');
};

window.cerrarModal = () => document.getElementById('modalPronosticos').classList.remove('active');
window.cerrarModalAfuera = e => { if (e.target.id === 'modalPronosticos') cerrarModal(); };

window.filtrarTabla = function () {
  const t = document.getElementById('buscarParticipante').value.toLowerCase();
  document.querySelectorAll('#cuerpoRanking tr').forEach(f => {
    const n = f.children[1] ? f.children[1].textContent.toLowerCase() : '';
    f.style.display = n.includes(t) ? '' : 'none';
  });
};

document.getElementById('btnDescargarImg').addEventListener('click', () => {
  const nombre = document.getElementById('nombre').value.trim() || 'Quiniela';
  const boton = document.getElementById('enviar');
  boton.style.display = 'none';
  html2canvas(document.getElementById('capturaContenedor'), { useCORS: true, allowTaint: true, scale: 2 }).then(canvas => {
    const a = document.createElement('a');
    a.download = 'Quiniela_' + nombre.replace(/\s+/g, '_') + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    boton.style.display = 'block';
  }).catch(() => { boton.style.display = 'block'; });
});

document.getElementById('formulario').addEventListener('submit', evento => {
  evento.preventDefault();
  if (!evento.currentTarget.reportValidity()) return;
  const datos = { Participante: document.getElementById('nombre').value.trim() };
  partidosGlobal.forEach((p, i) => {
    if (p.cerrado) return;
    datos[p.local] = Number(document.getElementById('gol_local_' + i).value || 0);
    datos[p.visitante] = Number(document.getElementById('gol_visita_' + i).value || 0);
  });
  const boton = document.getElementById('enviar'), mensaje = document.getElementById('mensaje'), acciones = document.getElementById('accionesPost');
  const restaurar = () => { boton.disabled = false; boton.textContent = 'ENVIAR QUINIELA'; };
  boton.disabled = true;
  boton.textContent = 'ENVIANDO…';
  mensaje.className = '';
  acciones.classList.remove('visible');

  google.script.run
    .withSuccessHandler(r => {
      if (r && r.ok) {
        mensaje.textContent = '¡Tu quiniela fue recibida con éxito!' +
          (r.omitidos && r.omitidos.length ? ' Ojo: ya habían empezado y no se guardaron: ' + r.omitidos.join(', ') + '.' : '');
        mensaje.className = 'exito';
        acciones.classList.add('visible');
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
      } else {
        mensaje.textContent = (r && r.mensaje) || 'Ocurrió un error al guardar en la hoja.';
        mensaje.className = 'error';
      }
      restaurar();
    })
    .withFailureHandler(e => {
      mensaje.textContent = (e && e.message) || 'No se pudo guardar. Revisa en POSICIONES si ya aparece tu nombre antes de reintentar.';
      mensaje.className = 'error';
      restaurar();
    })
    .registrarQuiniela(datos);
});

window.addEventListener('DOMContentLoaded', cargarDatosIniciales);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
</script>
</body>
</html>
